<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お店の帳簿 — 新しい版に切り替え</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 32px 20px; background: #f4f6f5; color: #1c2421; font-size: 18px; line-height: 1.6; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #dde3e0; border-radius: 14px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; background: #1f6f5c; color: #fff; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  <h1>新しい版に切り替えています…</h1>
  <p id="msg">少しお待ちください。帳簿の記録は消えません。</p>
</div>
<script>
// 古い版の画面ファイル（オフライン用の保存）だけを消す。帳簿の記録（localStorage）には触らない。
(async () => {
  const msg = document.getElementById('msg');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    let n = 0;
    try { const s = JSON.parse(localStorage.getItem('kaikei.v1')); n = s && s.entries ? s.entries.length : 0; } catch (e) {}
    msg.innerHTML = `古い版を片付けました。帳簿の記録 ${n} 件はそのままです。<br>下のボタンで帳簿を開いてください。`;
  } catch (e) {
    msg.textContent = 'うまくいきませんでした: ' + e.message;
  }
  const a = document.createElement('a'); a.href = './?v=' + Date.now(); a.textContent = '帳簿を開く';
  document.querySelector('.box').appendChild(a);
})();
</script>
</body>
</html>
